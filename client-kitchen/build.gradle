// JavaFX app for the kitchen: a status board showing every order grouped
// by state, with a button per order to advance it to the next status.
plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

javafx {
    version = "17.0.9"
    modules = ['javafx.controls']
}

dependencies {
    implementation project(':shared')
}

application {
    mainClass = 'school.swe2040.restaurant.kitchen.app.KitchenApp'
}
